# 本地开发环境专用编排文件。
# 下列默认密码/账号仅用于本机开发调试，生产环境必须通过环境变量覆盖，
# 禁止直接使用默认值部署到任何可被外部访问的环境。
services:
  mysql:
    image: mysql:8.0
    # 去掉了 restart: always，现在完全手动控制启动
    environment:
      # 默认密码仅用于开发环境，生产必须通过 MYSQL_ROOT_PASSWORD 覆盖
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-feedsystem}
      TZ: "Asia/Shanghai"
    ports:
      # 使用标准端口 3306，代码里直接连 3306 即可
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-time-zone=Asia/Shanghai
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # 去掉了 restart: always
    ports:
      # 使用标准端口 6379
      - "6379:6379"
    volumes:
      - redis_data:/data
    # 官方镜像不认 REDIS_PASSWORD 环境变量，必须在 command 里加 --requirepass
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    # 去掉了 restart: always
    ports:
      # 使用标准端口
      - "5672:5672"   # AMQP
      - "15672:15672" # 管理界面
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-password123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

# 后端服务
  backend-api:
    build:
      context: ./backend
    command: ["./api"]
    env_file:
      - .env.docker # 直接读取 .env.docker 文件里的环境变量
    volumes:
      - ./backend/assets/upload:/app/assets/upload
    # 健康检查：Nginx 依赖该状态，避免后端还没开始监听 8080 就转发请求导致大面积 502
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  backend-worker:
    build:
      context: ./backend
    command: ["./worker"]
    env_file:
      - .env.docker # 直接读取 .env.docker 文件里的环境变量
    volumes:
      - ./backend/assets/upload:/app/assets/upload
    depends_on:
      backend-api:
        condition: service_started # worker 等待 api 启动就行，或者也加上健康检查
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 前端服务
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # 前端打包产物
      - ./frontend/dist:/usr/share/nginx/html
      # 静态资源
      - ./backend/assets/upload:/usr/share/nginx/upload
      # Nginx 配置文件
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend-api:
        # 等后端 /healthz 通过后再启动 Nginx，避免启动瞬间的 502
        condition: service_healthy


volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
