server {
    listen 80;
    server_name localhost;

    # 1. 托管前端静态文件 (Nginx 内部的 /usr/share/nginx/html 对应宿主机的 dist)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 代理后端 API
    location /api/ {
        # 注意：这里用的是 docker-compose 里的服务名 backend-api
        proxy_pass http://backend-api:8080/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. 代理静态资源 (直接映射到 Nginx，减轻 Go 的压力)
    location /upload/ {
        # 配合下方的 volume 挂载，直接读静态文件
        alias /usr/share/nginx/upload/; 
    }

    # 4. SSE 推送专用长连接路由
    location /api/sse {
        proxy_pass http://backend-api:8080/sse;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}