server {
    listen 80;
    server_name localhost;
    client_max_body_size 200m; # 设置上传文件大小限制

    # Docker 内置 DNS。backend-api 容器重建后 IP 会变，Nginx 默认只在启动时解析一次，
    # 会一直连旧 IP 导致 502；配合下面变量形式的 proxy_pass 让 Nginx 每 10 秒重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. 托管前端静态文件 (Nginx 内部的 /usr/share/nginx/html 对应宿主机的 dist)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 代理后端 API
    # 注意：proxy_pass 使用变量后，Nginx 才会走上面的 resolver 动态解析服务名。
    # rewrite 负责去掉 /api 前缀：/api/feed/list -> /feed/list。
    location /api/ {
        set $backend_api http://backend-api:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend_api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off; # 关闭请求体缓冲，避免大文件上传时占用过多内存
        # 分片合并 / 大文件上传可能超过默认 60 秒
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 3. SSE 推送专用长连接路由
    # 前端 EventSource 连接的是同源的 /sse?ticket=...（见 Message.vue），
    # 所以必须单独匹配 /sse，否则会被 location / 当成前端路由返回 index.html。
    location = /sse {
        set $backend_api http://backend-api:8080;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # 必须关闭缓冲，否则消息会被攒在 Nginx 里
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 4. 内置静态资源（默认头像等）由 Go 的 /static 路由提供
    location /static/ {
        set $backend_api http://backend-api:8080;
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. 用户上传资源 (直接映射到 Nginx，减轻 Go 的压力)
    # 配合下方的 volume 挂载，直接读静态文件；静态文件模块原生支持 Range，视频可边下边播。
    location /upload/ {
        alias /usr/share/nginx/upload/;
    }
}
