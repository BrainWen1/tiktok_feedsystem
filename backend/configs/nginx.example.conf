# 静态资源托管示例（生产环境）
#
# 约定：
#   - StorageRoot/upload/  用户上传资源（covers/videos），由 Nginx 直接返回，Go 不转发文件流
#   - StorageRoot/static/  项目内置静态资源（默认头像、占位图）
#   - StorageRoot/upload/chunks/ 分片临时碎片，只供服务端合并使用，禁止对外暴露
#
# 将 /srv/feedsystem/storage 替换为实际的 STORAGE_ROOT 绝对路径。

server {
    listen 80;
    server_name example.com;

    # 与 Go 侧全局请求体上限保持一致，覆盖原有 100MB 视频上传；
    # 分片接口单片仅 5MB，由 Go handler 的 MaxBytesReader 再精确限制。
    client_max_body_size 110m;

    # 分片碎片属于服务端临时数据，直接拒绝外部访问
    location ^~ /upload/chunks/ {
        return 404;
    }

    # 用户上传资源：Nginx 直接读磁盘返回，避免 Go 进程转发大文件流
    location ^~ /upload/ {
        alias /srv/feedsystem/storage/upload/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=604800";
    }

    # 项目内置静态资源
    location ^~ /static/ {
        alias /srv/feedsystem/storage/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400";
    }

    # 其余接口反向代理到 Go 服务
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
