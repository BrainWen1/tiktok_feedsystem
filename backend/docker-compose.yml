# 本地开发环境专用编排文件。
# 下列默认密码/账号仅用于本机开发调试，生产环境必须通过环境变量覆盖，
# 禁止直接使用默认值部署到任何可被外部访问的环境。
services:
  mysql:
    image: mysql:8.0
    # 去掉了 restart: always，现在完全手动控制启动
    environment:
      # 默认密码仅用于开发环境，生产必须通过 MYSQL_ROOT_PASSWORD 覆盖
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-feedsystem}
      TZ: "Asia/Shanghai"
    ports:
      # 使用标准端口 3306，代码里直接连 3306 即可
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-time-zone=Asia/Shanghai
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # 去掉了 restart: always
    ports:
      # 使用标准端口 6379
      - "6379:6379"
    volumes:
      - redis_data:/data
    # 官方镜像不认 REDIS_PASSWORD 环境变量，必须在 command 里加 --requirepass
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    healthcheck:
      # 健康检查也需要带上密码
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-123456}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    # 去掉了 restart: always
    ports:
      # 使用标准端口
      - "5672:5672"   # AMQP
      - "15672:15672" # 管理界面
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-password123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data: