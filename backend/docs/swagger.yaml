          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 更新用户资料
      tags:
      - 用户模块
  /user/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh token 换取新的 access token 和 refresh token；data 包含 access_token、refresh_token、user_id、username
        字段
      parameters:
      - description: 刷新令牌信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: refresh token 无效或已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新令牌
      tags:
      - 用户模块
  /user/register:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码注册新用户；data 包含 status、user_id、username 字段
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: 参数错误或用户名已存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注册
      tags:
      - 用户模块
  /user/upload_avatar:
    post:
      consumes:
      - multipart/form-data
      description: 以 multipart/form-data 上传头像文件，仅支持 jpg/jpeg/png/webp；data 包含 avatar_url
        字段
      parameters:
      - description: 头像文件（jpg/jpeg/png/webp）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: 文件参数错误、大小不符合要求或格式不支持
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 上传用户头像
      tags:
      - 用户模块
  /video/{id}:
    get:
      description: 根据视频 ID 获取详情；软鉴权接口，可选携带 Authorization 头，携带时返回当前用户的真实点赞状态，游客 is_liked
        恒为 false
      parameters:
      - description: 视频 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.VideoDetailResponse'
              type: object
        "400":
          description: 视频ID不合法或视频不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取视频详情
      tags:
      - 视频模块
  /video/chunk/cancel:
    post:
      description: 取消上传并立即清理已上传分片目录与 Redis 会话，data 固定为 null
      parameters:
      - description: 分片上传会话 ID
        in: query
        name: upload_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 取消成功，data 为 null
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: upload_id 为空或会话不存在/过期
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 取消分片上传
      tags:
      - 视频模块
  /video/chunk/create:
    post:
      consumes:
      - application/json
      description: 根据文件名与文件大小创建（或恢复）分片上传会话，返回 upload_id、分片大小与总分片数，用于后续分片上传与断点续传
      parameters:
      - description: 创建会话参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateSessionReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，data 包含 upload_id、chunk_size、total_chunks、expire_at 字段
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: 请求参数错误或上传参数不合法
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 创建分片上传会话
      tags:
      - 视频模块
  /video/chunk/merge:
    post:
      description: 校验并合并全部分片生成成品视频，返回可直接用于发布接口的视频访问路径；分片未全部上传完成时返回 400
      parameters:
      - description: 分片上传会话 ID
        in: query
        name: upload_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 合并成功，data 包含 video_url 字段
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: upload_id 为空、会话不存在/过期、分片未传完或文件校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 合并分片
      tags:
      - 视频模块
  /video/chunk/status:
    get:
      description: 查询会话已上传的分片列表，前端据此只补传缺失分片，实现断点续传
      parameters:
      - description: 分片上传会话 ID
        in: query
        name: upload_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功，data 包含 upload_id、total_chunks、chunk_size、uploaded、expire_at
            字段
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: upload_id 为空或会话不存在/过期
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 查询分片上传状态
      tags:
      - 视频模块
  /video/chunk/upload:
    post:
      consumes:
      - application/octet-stream
      description: 请求体直接为分片二进制内容（application/octet-stream），upload_id 与分片序号通过 query
        传入；单个分片大小受服务端限制
      parameters:
      - description: 分片上传会话 ID
        in: query
        name: upload_id
        required: true
        type: string
      - description: 分片序号，从 0 开始
        in: query
        name: index
        required: true
        type: integer
      - description: 分片二进制内容
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功，data 包含 uploaded（已上传分片序号列表）与 received（本次分片序号）
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: 分片参数不合法、会话不存在、分片缺失或校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 上传单个分片
      tags:
      - 视频模块
  /video/list:
    get:
      description: 按作者 ID 分页获取视频列表，使用 (cursor.last_created_at, cursor.last_vid) 复合游标翻页；软鉴权接口，可选携带
        Authorization 头以返回点赞状态
      parameters:
      - description: 作者用户 ID
        in: query
        name: author_id
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 上一页最后一条视频 ID（游标）
        in: query
        name: cursor.last_vid
        type: string
      - description: 上一页最后一条视频创建时间（RFC3339，游标）
        in: query
        name: cursor.last_created_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.VideoListResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取指定作者的视频列表
      tags:
      - 视频模块
  /video/publish:
    post:
      consumes:
      - application/json
      description: 使用已上传的视频地址与封面地址创建视频记录，可同时提交标签列表
      parameters:
      - description: 发布视频信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PublishVideoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 发布成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.PublishVideoResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 发布视频
      tags:
      - 视频模块
  /video/upload_cover:
    post:
      consumes:
      - multipart/form-data
      description: 上传视频封面图片（multipart/form-data，字段名 file），成功后返回可直接用于发布接口的封面地址；仅支持
        jpg/jpeg/png/webp
      parameters:
      - description: 封面图片（jpg/jpeg/png/webp）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功，data 包含 cover_url 字段
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: 文件参数错误、大小不符合要求或格式不合法
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 上传视频封面
      tags:
      - 视频模块
  /video/upload_video:
    post:
      consumes:
      - multipart/form-data
      description: 上传视频原始文件（multipart/form-data，字段名 file），成功后返回可直接用于发布接口的访问地址；仅支持
        mp4/avi/mov/mkv，单文件约 100MB 以内
      parameters:
      - description: 视频文件（mp4/avi/mov/mkv）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功，data 包含 video_url 字段
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: 文件参数错误、大小不符合要求或格式不合法
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 上传视频文件
      tags:
      - 视频模块
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
