  /sse:
    get:
      description: 使用 POST /sse/ticket 获取的一次性 ticket 建立 SSE 长连接，持续接收实时私信。服务端返回 text/event-stream：event
        为 message 时 data 为消息内容，event 为 heartbeat 时 data 为 ping（每 15 秒一次）；连接建立后不返回
        JSON，客户端断开即结束。ticket 30 秒内有效且仅可使用一次
      parameters:
      - description: 一次性连接票据，由 POST /sse/ticket 获取
        in: query
        name: ticket
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE 事件流（event: message / event: heartbeat）'
          schema:
            type: string
        "400":
          description: 缺少 ticket、ticket 无效或已过期
          schema:
            $ref: '#/definitions/response.Response'
      summary: 建立 SSE 实时消息连接
      tags:
      - 私信模块
