    post:
      description: 为当前登录用户签发一次性 SSE 连接票据，data 包含 ticket 字段；ticket 30 秒内有效且仅可使用一次，用于浏览器
        EventSource 无法携带 Authorization 头时的鉴权
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功，data 包含 ticket 字段
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "401":
