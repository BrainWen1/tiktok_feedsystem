basePath: /
definitions:
  dto.AuthorBrief:
    properties:
      avatar_url:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      confirm_password:
        description: 确认新密码
        type: string
      new_password:
        type: string
      old_password:
        type: string
    type: object
  dto.DeleteCommentRequest:
    properties:
      comment_id:
        type: integer
    type: object
  dto.FeedCursor:
    properties:
      last_created_at:
        type: string
      last_likes_count:
        type: integer
      last_popularity:
        type: integer
      last_uid:
        description: 关注/粉丝列表使用，与 last_vid 语义一致，均为业务主键
        type: string
      last_vid:
        type: string
    type: object
  dto.FeedItemResp:
    properties:
      author_name:
        type: string
      author_uid:
        type: integer
      avatar_url:
        type: string
      comments_cnt:
        description: 评论总数
        type: integer
      cover_url:
        type: string
      created_at:
        description: 视频创建时间戳
        type: string
      desc:
        type: string
      is_follow:
        description: 当前登录用户是否关注作者
        type: boolean
      is_like:
        description: 当前登录用户是否点赞该视频
        type: boolean
      likes_cnt:
        description: 点赞总数，优先取缓存中的实时展示值
        type: integer
      popularity:
        description: 热度值，越大越热
        type: integer
      title:
        type: string
      vid:
        type: string
      video_url:
        type: string
    type: object
  dto.FeedListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/dto.FeedItemResp'
        type: array
      next_cursor:
        $ref: '#/definitions/dto.FeedCursor'
    type: object
  dto.FindByIDRequest:
    properties:
      user_id:
        type: integer
    type: object
  dto.FindByUsernameRequest:
    properties:
      user_name:
        type: string
    type: object
  dto.FollowRequest:
    properties:
      blogger_id:
        type: integer
    required:
    - blogger_id
    type: object
  dto.GetHistoryResponse:
    properties:
      has_more:
        description: 是否还有更早的消息
        type: boolean
      messages:
        description: 新 -> 旧
        items:
          $ref: '#/definitions/model.Message'
        type: array
      next_last_id:
        description: 供前端请求下一页的游标
        type: integer
    type: object
  dto.LikeRequest:
    properties:
      video_id:
        type: integer
    required:
    - video_id
    type: object
  dto.ListCommentsResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/model.Comment'
        type: array
      has_more:
        description: 是否还有更多评论
        type: boolean
      last_id:
        type: integer
      last_time:
        description: 给前端下一轮请求的游标（Unix毫秒）
        type: integer
      total:
        description: 视频评论总数量，来自Redis计数器
        type: integer
    type: object
  dto.ListLikedVideosRequest:
    properties:
      cursor:
        $ref: '#/definitions/dto.FeedCursor'
      page_num:
        maximum: 100000
        minimum: 1
        type: integer
      page_size:
        maximum: 30
        minimum: 1
        type: integer
      user_id:
        maximum: 4294967295
        minimum: 1
        type: integer
    required:
    - page_size
    - user_id
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      user_name:
        type: string
    type: object
  dto.LoginResponse:
    properties:
      refresh_token:
        type: string
      token:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        description: 为了适应前期的简单设计，登出时也需要传入refreshToken，方便在Redis中删除对应的refreshToken
        type: string
    type: object
  dto.MarkAsReadRequest:
    properties:
      notification_id:
        type: integer
    required:
    - notification_id
    type: object
  dto.ProfileResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      id:
        type: integer
      user_name:
        type: string
    type: object
  dto.PublishCommentRequest:
    properties:
      content:
        type: string
      parent_id:
        type: integer
      video_id:
        type: integer
    type: object
  dto.PublishVideoRequest:
    properties:
      cover_url:
        type: string
      description:
        type: string
      tags:
        description: 标签，写入 video_tag 关联表
        items:
          type: string
        type: array
      title:
        type: string
      video_url:
        type: string
    type: object
  dto.PublishVideoResponse:
    properties:
      video_id:
        type: integer
    type: object
  dto.RefreshRequest:
    properties:
      old_access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      password:
        type: string
      user_name:
        type: string
    type: object
  dto.SendMessageRequest:
    properties:
      content:
        type: string
      receiver_id:
        type: integer
    required:
    - content
    - receiver_id
    type: object
  dto.SessionDetail:
    properties:
      content:
        description: 最新消息内容
        type: string
      created_at:
        description: 最新消息时间
        type: integer
      target_id:
        description: 对方的 userID
        type: integer
      target_name:
        description: 对方的用户名
        type: string
      unread_count:
        description: 未读消息数
        type: integer
    type: object
  dto.UnfollowRequest:
    properties:
      blogger_id:
        type: integer
    required:
    - blogger_id
    type: object
  dto.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      user_name:
        description: 使用指针类型，这样可以区分字段是未传入还是传入了空值
        type: string
    type: object
  dto.VideoDetailResponse:
    properties:
      author:
        $ref: '#/definitions/dto.AuthorBrief'
      cover_url:
        type: string
      description:
        type: string
      is_liked:
        description: 软鉴权：游客永远false，登录用户才会算出真实状态
        type: boolean
      like_count:
        type: integer
      title:
        type: string
      video_id:
        type: integer
      video_url:
        type: string
    type: object
  dto.VideoListResponse:
    properties:
      next_cursor:
        allOf:
        - $ref: '#/definitions/dto.FeedCursor'
        description: 复合游标，为空表示没有下一页
      total:
        type: integer
      videos:
        items:
          $ref: '#/definitions/dto.VideoDetailResponse'
        type: array
    type: object
  handler.CreateSessionReq:
    properties:
      file_hash:
        description: 可选，提供时合并后强制校验
        type: string
      file_size:
        type: integer
      filename:
        type: string
    required:
    - file_size
    - filename
    type: object
  model.Comment:
    properties:
      content:
        description: 评论内容
        type: string
      created_at:
        description: 创建时间，复合索引用于按视频ID和创建时间排序
        type: string
      id:
        type: integer
      parent_id:
        description: 父评论ID，0表示顶级评论
        type: integer
      user_id:
        description: 关联用户ID
        type: integer
      user_name:
        description: 冗余关联用户名
        type: string
      video_id:
        description: 关联视频ID
        type: integer
    type: object
  model.Message:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        description: 在主键 ID 上追加一个联合索引，优先级为 2
        type: integer
      is_read:
        type: boolean
      receiver_id:
        type: integer
      sender_id:
        description: |-
          SenderID 和 ReceiverID 之间有两个联合索引，分别是 idx_sender_receiver 和 idx_receiver_sender
          分别用于加速查询 “用户发送给别人的消息” 和 “用户接受到别人的消息”
        type: integer
      sender_name:
        type: string
    type: object
  response.Response:
    properties:
      code:
        description: 状态码
        type: integer
      data:
        description: 数据
      message:
        description: 消息
        type: string
    type: object
info:
  contact: {}
  description: 短视频 Feed 流系统后端接口文档
  termsOfService: http://swagger.io/terms/
  title: TikTok Feed System API
  version: "1.0"
paths:
  /comment/delete:
    post:
      consumes:
      - application/json
      description: 当前登录用户删除自己发布的评论
      parameters:
      - description: 删除评论信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 评论删除成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 删除评论
      tags:
      - 评论模块
  /comment/list:
    get:
      description: 按 (last_time, last_id) 游标分页获取指定视频的评论列表；软鉴权接口，可选携带 Authorization
        头
      parameters:
      - description: 视频 ID
        in: query
        name: video_id
        required: true
        type: integer
      - description: 上一页最后一条评论的 Unix 毫秒时间戳（第一页不传）
        in: query
        name: last_time
        type: integer
      - description: 上一页最后一条评论 ID，与 last_time 成对使用
        in: query
        name: last_id
        type: integer
      - description: 每页数量，范围 5-50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ListCommentsResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取视频评论列表
      tags:
      - 评论模块
  /comment/publish:
    post:
      consumes:
      - application/json
      description: 当前登录用户对指定视频发布评论，parent_id 非 0 时表示回复该条评论
      parameters:
      - description: 评论信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PublishCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 评论发布成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 发布评论
      tags:
      - 评论模块
  /feed/list:
    get:
      description: 按创建时间倒序返回视频流，使用 (cursor.last_created_at, cursor.last_vid) 复合游标翻页；软鉴权接口，可选携带
        Authorization 头以返回点赞/关注状态
      parameters:
      - description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 上一页最后一条视频 ID（游标）
        in: query
        name: cursor.last_vid
        type: string
      - description: 上一页最后一条视频创建时间（RFC3339，游标）
        in: query
        name: cursor.last_created_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.FeedListResp'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取最新视频流
      tags:
      - 动态流模块
  /feed/listByFollowing:
    get:
      description: 返回当前登录用户所关注博主发布的视频，使用 (cursor.last_created_at, cursor.last_vid)
        复合游标翻页
      parameters:
      - description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 上一页最后一条视频 ID（游标）
        in: query
        name: cursor.last_vid
        type: string
      - description: 上一页最后一条视频创建时间（RFC3339，游标）
        in: query
        name: cursor.last_created_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.FeedListResp'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 获取关注博主的视频流
      tags:
      - 动态流模块
  /feed/listByLikesCount:
    get:
      description: 按视频点赞总数降序返回视频流，使用 (cursor.last_likes_count, cursor.last_vid) 复合游标翻页；软鉴权接口，可选携带
        Authorization 头以返回点赞/关注状态
      parameters:
      - description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 上一页最后一条视频 ID（游标）
        in: query
        name: cursor.last_vid
        type: string
      - description: 上一页最后一条视频的点赞总数（游标）
        in: query
        name: cursor.last_likes_count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.FeedListResp'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取点赞数榜单视频流
      tags:
      - 动态流模块
  /feed/listByPopularity:
    get:
      description: 按热度值（popularity）倒序返回视频流，使用 (cursor.last_popularity, cursor.last_vid)
        复合游标翻页；软鉴权接口，可选携带 Authorization 头以返回点赞/关注状态
      parameters:
      - description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 上一页最后一条视频 ID（游标）
        in: query
        name: cursor.last_vid
        type: string
      - description: 上一页最后一条视频的热度值（游标）
        in: query
        name: cursor.last_popularity
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.FeedListResp'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取热门视频流
      tags:
      - 动态流模块
  /feed/listByTag:
    get:
      description: 根据标签筛选视频，按创建时间倒序返回，使用 (cursor.last_created_at, cursor.last_vid)
        复合游标翻页；软鉴权接口，可选携带 Authorization 头以返回点赞/关注状态
      parameters:
      - description: 标签名称
        in: query
        name: tag
        required: true
        type: string
      - description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 上一页最后一条视频 ID（游标）
        in: query
        name: cursor.last_vid
        type: string
      - description: 上一页最后一条视频创建时间（RFC3339，游标）
        in: query
        name: cursor.last_created_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.FeedListResp'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 按标签获取视频流
      tags:
      - 动态流模块
  /like/is_liked:
    post:
      consumes:
      - application/json
      description: 查询当前登录用户是否点赞了指定视频，data 为布尔值
      parameters:
      - description: 查询信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LikeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: boolean
              type: object
        "400":
          description: 请求参数错误或查询失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 查询是否已点赞
      tags:
      - 点赞模块
  /like/like:
    post:
      consumes:
      - application/json
      description: 当前登录用户对指定视频点赞，重复点赞按幂等处理
      parameters:
      - description: 点赞信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LikeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 点赞成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 请求参数错误或点赞失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 点赞视频
      tags:
      - 点赞模块
  /like/list_liked:
    post:
      consumes:
      - application/json
      description: 分页列出指定用户点赞过的视频，使用 (cursor.last_vid, cursor.last_created_at) 复合游标翻页；软鉴权接口，可选携带
        Authorization 头以返回当前用户的点赞状态
      parameters:
      - description: 查询参数，user_id 必填
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ListLikedVideosRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.VideoListResponse'
              type: object
        "400":
          description: 请求参数错误或获取失败
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取用户点赞过的视频
      tags:
      - 点赞模块
  /like/unlike:
    post:
      consumes:
      - application/json
      description: 当前登录用户取消对指定视频的点赞，未点赞时按幂等处理
      parameters:
      - description: 取消点赞信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LikeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 取消点赞成功
          schema:
            allOf:
